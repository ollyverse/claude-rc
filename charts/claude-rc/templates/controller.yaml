{{- if .Values.controller.enabled }}
{{- $labels := dict "root" . "tier" "controller" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "claude-rc.fullname" . }}
  labels:
    {{- include "claude-rc.labels" $labels | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "claude-rc.fullname" . }}
  labels:
    {{- include "claude-rc.labels" $labels | nindent 4 }}
spec:
  # One volume, one Remote Control server: never two pods at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "claude-rc.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "claude-rc.labels" $labels | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "claude-rc.fullname" . }}
      # kubectl in the session scales the workers with this token (controller-rbac.yaml).
      automountServiceAccountToken: true
      securityContext:
        {{- include "claude-rc.podSecurityContext" . | nindent 8 }}
      containers:
        - name: claude
          image: {{ include "claude-rc.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The one-time trust and Remote Control questions, and kubectl attach later.
          tty: true
          stdin: true
          env:
            {{- include "claude-rc.claudeEnv" (dict "root" . "ordinal" "0") | nindent 12 }}
          securityContext:
            {{- include "claude-rc.claudeSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            {{- include "claude-rc.claudeVolumeMounts" . | nindent 12 }}
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "claude-rc.fullname" . }}
        {{- include "claude-rc.sharedVolumes" . | nindent 8 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
